<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161e28" media="(prefers-color-scheme: dark)" />
    <script>
      // apply a saved theme before the first paint so dark mode never flashes white
      try {
        var t = localStorage.getItem('ba_theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        if (localStorage.getItem('ba_text') === 'large') document.documentElement.setAttribute('data-text', 'large')
      } catch (e) {}
    </script>
    <meta name="description" content="中联银行 Central Union Bank: say what you need; the AI plans it, and the bank's fixed rules decide what runs, what needs your confirmation and what needs your PIN." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <title>中联银行 Central Union Bank</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
